name: build-cloudflared-freebsd

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "上游 cloudflared 版本号"
        required: true
        default: "2026.10.4"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upstream
        uses: actions/checkout@v4
        with:
          repository: cloudflare/cloudflared
          ref: ${{ inputs.tag }}

      - name: Show source commit
        run: git log -1 --format='%H %s'

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Patch diagnostic for FreeBSD
        run: |
          f=$(grep -rl "NetworkCollectorImpl struct" diagnostic/network/ | grep -v windows || true)
          echo "Target file(s): $f"
          if [ -z "$f" ]; then
            ls -la diagnostic/network/
            grep -rn "NetworkCollectorImpl" diagnostic/ || true
            exit 1
          fi
          for x in $f; do
            echo "--- before: $x"; head -5 "$x"
            sed -i -E '/^\/\/go:build/ s/(darwin \|\| linux)/\1 || freebsd/' "$x"
            sed -i -E '/^\/\/ \+build/ s/(darwin linux|linux darwin)/\1 freebsd/' "$x"
            echo "--- after: $x"; head -5 "$x"
          done

      - name: Add FreeBSD system collector
        run: |
          ls -la diagnostic/
          cands=$(grep -l "func NewSystemCollectorImpl" diagnostic/*.go | grep -v -e windows -e _test || true)
          echo "定义文件: $cands"
          if [ -z "$cands" ]; then
            grep -rn "NewSystemCollectorImpl" diagnostic/ || true
            exit 1
          fi
          src=$(echo "$cands" | grep -i -e darwin -e macos | head -1)
          [ -z "$src" ] && src=$(echo "$cands" | head -1)
          echo "选用: $src"
          dst=diagnostic/system_collector_freebsd.go
          cp "$src" "$dst"
          sed -i -E '/^\/\/go:build/d; /^\/\/ \+build/d' "$dst"
          sed -i '1i //go:build freebsd\n' "$dst"
          head -8 "$dst"

      - name: Add FreeBSD token file helper
        run: |
          echo "== createTokenFile 相关定义和调用 =="
          grep -rn "createTokenFile" cmd/cloudflared/ || true
          echo "== common_service.go 开头 60 行 =="
          sed -n '1,60p' cmd/cloudflared/common_service.go

          # 优先：找非 Windows 的 createTokenFile( 定义，精确匹配，不含 Unix 后缀
          src=$(grep -l "^func createTokenFile(" cmd/cloudflared/*.go | grep -v -e _test -e windows | head -1 || true)
          if [ -n "$src" ]; then
            echo "找到定义: $src"
            awk '/^func createTokenFile\(/{p=1} p{print} p&&/^}/{exit}' "$src" > /tmp/func.go
          else
            echo "未找到非 Windows 定义，改用 createTokenFileUnix 复制改名"
            awk '/^func createTokenFileUnix\(/{p=1} p{print} p&&/^}/{exit}' cmd/cloudflared/common_service.go \
              | sed 's/^func createTokenFileUnix(/func createTokenFile(/' > /tmp/func.go
          fi
          echo "--- 抽出的函数:"; cat /tmp/func.go
          if [ ! -s /tmp/func.go ]; then echo "函数为空，终止"; exit 1; fi

          { printf '//go:build freebsd\n\npackage main\n\n'; cat /tmp/func.go; } > cmd/cloudflared/token_file_freebsd.go
          go install golang.org/x/tools/cmd/goimports@latest
          "$(go env GOPATH)/bin/goimports" -w cmd/cloudflared/token_file_freebsd.go
          echo "--- 生成的文件:"; cat cmd/cloudflared/token_file_freebsd.go

      - name: Build
        run: |
          mkdir -p out
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=freebsd GOARCH=$arch \
              go build -trimpath -buildvcs=false -gcflags=-e \
              -ldflags "-s -w -X main.Version=${{ inputs.tag }}" \
              -o out/cloudflared-freebsd-$arch ./cmd/cloudflared
          done
          file out/*
          cd out && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: cloudflared ${{ inputs.tag }} (FreeBSD)
          body: "Upstream cloudflared ${{ inputs.tag }} cross-compiled for FreeBSD. Changes: freebsd build tags in diagnostic/network; freebsd copies of the system collector (diagnostic/) and createTokenFile (cmd/cloudflared/). Tunnel code is untouched."
          files: out/*
